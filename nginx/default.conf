# 컨테이너 안의 정적 파일 서버.
# /api 는 여기서 처리하지 않는다. 호스트 Nginx가 /api 를 백엔드(127.0.0.1:8000)로 보낸다.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # 배포 직후 브라우저가 새 엔트리를 받게 한다.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /config.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Vite가 해시를 붙인 파일. 없으면 SPA로 넘기지 않고 404.
    # always 를 붙이면 404 까지 1년 캐시된다.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 파일이 없는 경로는 index.html (SPA).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
